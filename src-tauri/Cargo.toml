[package]
name = "web-manager"
version = "0.8.9"
description = "Multi-site, multi-account web manager"
authors = ["mozm-ctrl"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "web_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["time"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# Self-update from GitHub Releases (see README「自动更新」) and relaunch afterwards.
# System TLS (Security.framework) instead of rustls keeps the app ~2 MB smaller.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Checks whether a saved login exists without reading it (no Keychain prompt).
security-framework = "3"
# Raises the sidebar UI above the account webviews while a dialog is open (see `raise_ui`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
